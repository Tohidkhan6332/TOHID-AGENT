name: TOHID-AGENT V11 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check app.js
      - run: node --check config.js
      - run: node --check MrTohid.js
      - run: node --check lib/openai.js
      - run: node --check lib/agentTools.js
      - run: node --check lib/agentPlanner.js
      - run: node --check lib/agentCore.js
      - run: node --check lib/skills.js
      - run: node --check lib/heroku.js
      - run: node --check lib/database.js
      - run: node --check lib/router.js
      - run: node --check lib/buttons.js
      - run: node --check lib/preflight.js
      - run: node --check lib/logger.js
      - run: node --check scripts/prestart.js
      - run: node --check lib/mission.js
      - run: node --check lib/scheduler.js
      - run: node -e "const fs=require(\"fs\"); const cp=require(\"child_process\"); const files=[]; function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if([\"node_modules\",\".git\",\".tohid-control\",\".tohid-sessions\"].includes(e.name)) continue; const p=require(\"path\").join(d,e.name); if(e.isDirectory()) walk(p); else if(p.endsWith(\".js\")) files.push(p)}} walk(\".\"); for(const f of files) cp.execFileSync(process.execPath,[\"--check\",f],{stdio:\"inherit\"}); console.log(\"Checked \"+files.length+\" JavaScript files\");"
      - run: npm test
